services:

  # ─────────────────────────────────────────────────────────────────────────────
  # HashiCorp Vault — PKI BlueLock
  #
  # Architecture PKI deux niveaux dans Vault :
  #   Mount pki/      → Root CA     (utilisé une fois pour signer l'intermediate)
  #   Mount pki_int/  → Intermediate CA (émet les certificats des services)
  #
  # Déploiement :
  #   1. Créer le cert bootstrap : scripts/00-bootstrap-tls.sh
  #   2. Démarrer Vault          : docker compose up -d
  #   3. Initialiser Vault       : scripts/01-init-vault.sh
  #   4. Configurer la PKI       : scripts/02-setup-pki.sh
  #   5. Émettre les certs       : scripts/03-issue-cert.sh <service> <dns>
  # ─────────────────────────────────────────────────────────────────────────────

  # Init container : corrige les permissions des volumes pour l'UID 100 (vault)
  # Nécessaire car depuis Vault 1.13+, le container tourne en non-root
  vault-init-perms:
    image: alpine:3.19
    user: root
    command: sh -c "chown -R 100:1000 /vault/data /vault/logs"
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs

  vault:
    image: hashicorp/vault:${VAULT_VERSION}
    container_name: bluelock-vault
    restart: unless-stopped
    depends_on:
      vault-init-perms:
        condition: service_completed_successfully
    cap_add:
      - IPC_LOCK  # Empêche la mémoire contenant les secrets d'être swappée sur disque
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_CACERT=/vault/certs/vault.crt
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./config:/vault/config      # Sans :ro — Vault tente un chown au démarrage
      - ./certs:/vault/certs:ro
    ports:
      - "8200:8200"
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - bluelock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "vault status -address=https://127.0.0.1:8200 -ca-cert=/vault/certs/vault.crt 2>&1 | grep -E '(Initialized|Sealed)'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  vault-data:
    driver: local
  vault-logs:
    driver: local

networks:
  bluelock:
    name: bluelock
    driver: bridge
