version: '3.8'

services:

  # ── Elasticsearch (Sécurité basique activée, sans TLS en interne) ──────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: bluelock-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=elasticsearch
      - cluster.name=bluelock-siem-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - XPACK_SECURITY_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
      - XPACK_REPORTING_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
      - XPACK_ACTION_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - bluelock
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 120

  # ── Kibana (Connecté en HTTP simple en interne derrière le proxy) ──────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: bluelock-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=Basile44
      - SERVER_SSL_ENABLED=false
      - I18N_LOCALE=fr-FR
    volumes:
      - kibanadata:/usr/share/kibana/data
    networks:
      - bluelock
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302'"]
      interval: 10s
      timeout: 10s
      retries: 120

  # ── Nginx Reverse Proxy (Exposition HTTPS de Kibana) ───────────────────────────────
  siem-proxy:
    image: nginx:alpine
    container_name: siem-proxy
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vault-agent/certs:/etc/nginx/certs:ro
    depends_on:
      - kibana
    networks:
      - bluelock

volumes:
  esdata:
    driver: local
  kibanadata:
    driver: local

networks:
  bluelock:
    name: bluelock
    driver: bridge