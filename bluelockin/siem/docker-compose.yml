version: '3.8'

services:

  # ── Elasticsearch (Sécurité basique activée, sans TLS) ──────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: bluelock-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=elasticsearch
      - cluster.name=bluelock-siem-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      # Désactivation de TLS pour le HTTP et le Transport
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      # Allocation de 4 Go de RAM (parfait pour ta VM de 8 Go)
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      # Ouvert sur toutes les interfaces pour y accéder depuis Windows 11
      - "9200:9200"
    networks:
      - bluelock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'"
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # ── Kibana (Connecté en HTTP simple) ───────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: bluelock-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - SERVERNAME=kibana
      # Connexion à ES en http:// au lieu de https://
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=Basile44
      - SERVER_SSL_ENABLED=false
      - I18N_LOCALE=fr-FR
      # Clés de chiffrement persistantes (Format requis pour l'API des règles d'alertes)
      - XPACK_SECURITY_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
      - XPACK_REPORTING_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
      - XPACK_ACTION_ENCRYPTIONKEY=abcdefghijklmnopqrstuvwxyz123456
    volumes:
      - kibanadata:/usr/share/kibana/data
    ports:
      - "5601:5601"
    networks:
      - bluelock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"
        ]
      interval: 10s
      timeout: 10s
      retries: 120

volumes:
  esdata:
    driver: local
  kibanadata:
    driver: local

networks:
  bluelock:
    name: bluelock
    driver: bridge
