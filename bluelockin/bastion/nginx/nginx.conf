worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # ── Logs ────────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Sécurité TLS ────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # ── Headers sécurité ────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;

    # ── Redirection HTTP → HTTPS ─────────────────────────────────────────────
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── Bastion HTTPS ────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name bastion.bluelock.local;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Timeout élevé pour les sessions SSH/RDP longues
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Headers requis par Guacamole
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Redirection racine vers /guacamole/
        location = / {
            return 301 https://$host/guacamole/;
        }

        # Proxy vers l'application Guacamole
        location /guacamole/ {
            proxy_pass http://guacamole:8080/guacamole/;

            # WebSocket requis pour les sessions interactives
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Buffers pour les flux RDP/VNC
            proxy_buffering    off;
            proxy_buffer_size  4k;
        }
    }
}
