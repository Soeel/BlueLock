services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Apache Guacamole — Bastion BlueLock
  #
  # Stack :
  #   guacd       → Démon natif Guacamole (proxy SSH/RDP/VNC), port 4822 interne
  #   postgres    → Base de données auth/sessions Guacamole
  #   guacamole   → Application web Java, port 8080 interne
  #   nginx       → Reverse proxy TLS (port 443), cert signé par la PKI Vault
  #
  # Déploiement :
  #   1. Émettre le cert depuis la PKI : ../pki/scripts/04-issue-cert.sh bastion bastion.bluelock.local
  #   2. Copier les certs             : scripts/01-copy-certs.sh
  #   3. Initialiser la DB            : scripts/02-init-db.sh
  #   4. Démarrer                     : docker compose up -d
  # ─────────────────────────────────────────────────────────────────────────────

  guacd:
    image: guacamole/guacd:${GUACAMOLE_VERSION}
    container_name: bluelock-guacd
    restart: unless-stopped
    networks:
      - bastion-internal

  postgres:
    image: postgres:16-alpine
    container_name: bluelock-guac-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - guac-db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro  # Scripts SQL d'init Guacamole
    networks:
      - bastion-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION}
    container_name: bluelock-guacamole
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      - GUACD_HOSTNAME=guacd
      - GUACD_PORT=4822
      - POSTGRESQL_HOSTNAME=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - POSTGRESQL_USER=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      # Désactiver l'authentification anonyme
      - POSTGRESQL_AUTO_CREATE_ACCOUNTS=false
    networks:
      - bastion-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/guacamole/ | grep -q 'guacamole'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: bluelock-bastion-nginx
    restart: unless-stopped
    depends_on:
      guacamole:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    ports:
      - "443:443"
    networks:
      - bastion-internal
      - bluelock

volumes:
  guac-db:
    driver: local

networks:
  # Réseau interne : guacd, postgres, guacamole, nginx
  bastion-internal:
    name: bastion-internal
    driver: bridge
    internal: true
  # Réseau externe : nginx exposé uniquement
  bluelock:
    name: bluelock
    driver: bridge
